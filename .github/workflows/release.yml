name: Build Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      upload_release:
        description: '创建 GitHub Release 并上传 APK'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 若配置了签名 secrets，解码 keystore 并写入环境变量；否则跳过，编译无签名 release
      - name: Prepare signing (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到签名 secret，将编译签名 release"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未配置签名 secret，将编译无签名 release"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build unsigned release APK
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate & rename APK
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "❌ 未找到 APK 产物"; exit 1
          fi
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          SIGNED="${{ steps.signing.outputs.available }}"
          if [ "$SIGNED" = "true" ]; then
            OUT="xigua-tv-${VER}-signed.apk"
          else
            OUT="xigua-tv-${VER}-unsigned.apk"
          fi
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Verify APK signing (if signed)
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="${{ steps.apk.outputs.path }}"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --verbose "$APK" || true

      

      - name: Create GitHub Release
        #if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.upload_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: ${{ steps.apk.outputs.path }}
          
